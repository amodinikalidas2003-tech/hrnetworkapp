{% load static %}

<!--Core Javascript-->

{% if has_customizer %}
<script src="{% static 'vendor/libs/pickr/pickr.js' %}"></script>
{% endif %}

<script src="{% static 'vendor/libs/jquery/jquery.js' %}"></script>
<script src="{% static 'vendor/libs/popper/popper.js' %}"></script>
<script src="{% static 'vendor/js/bootstrap.js' %}"></script>
<script src="{% static 'vendor/libs/@algolia/autocomplete-js.js' %}"></script>
<script src="{% static 'vendor/libs/perfect-scrollbar/perfect-scrollbar.js' %}"></script>
<script src="{% static 'vendor/libs/node-waves/node-waves.js' %}"></script>
<script src="{% static 'vendor/libs/hammer/hammer.js' %}"></script>
<script src="{% static 'vendor/js/menu.js' %}"></script>
<script src="{% static 'vendor/libs/select2/select2.js' %}"></script>
<script src="{% static 'js/main.js' %}"></script>
<script>
  // Initialize Select2 on all select elements with search functionality
  $(function() {
    $('select').each(function() {
      var $this = $(this);
      // Skip if already has select2 initialized or has selectpicker class
      if (!$this.hasClass('select2-hidden-accessible') && !$this.hasClass('selectpicker')) {
        $this.wrap('<div class="position-relative"></div>').select2({
          placeholder: 'Select an option',
          dropdownParent: $this.parent(),
          width: '100%',
          allowClear: true
        });
      }
    });
  });
</script>
